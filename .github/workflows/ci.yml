name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # WizWalker is Windows-only (platform marker), so this installs just the
      # pure-Python pieces needed for the unit tests.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
