# Myth wizard preset (Wizard City onwards). Use with:
#   wiz101-auto run -c configs/myth.yaml
#
# Myth hits hard but has 80% base accuracy and no heals of its own, so this
# leans on potions and wisps, stacks a Myth blade/trap before big targets,
# and keeps shields in the deck.
mode: quest

quest:
  teleport: true
  accept_side_quests: true
  stuck_minutes: 12

upkeep:
  use_potions: true
  potion_health_ratio: 0.55
  potion_mana_ratio: 0.25
  collect_wisps: true
  min_health_to_fight: 0.85  # below this, heal up (potion, wisps, rest) before questing
  rest_until_health: 0.95
  rest_max_minutes: 8       # stop the bot if health can't be recovered in this time
  wisp_health_ratio: 0.85

safety:
  stop_key: ctrl+shift+q     # any ctrl/shift/alt combo + one key, e.g. "ctrl+]"
  pause_key: ctrl+shift+p
  stall_seconds: 15          # nothing happens this long -> close menus, restart step, switch quest...
  max_hours: 0             # 0 = no limit: run until stopped

combat:
  max_discards: 4
  flee_below: 0.0
  strategy:
    heal_threshold: 0.5       # only matters once you have a heal (e.g. a Life secondary)
    shield_threshold: 0.55
    max_blades: 2
    max_traps: 2
    boss_setup: true
    setup_health_multiplier: 1.0

progression:
  enabled: true
  school: Myth
  rebuild_on_start: true
  check_minutes: 30
  auto_train: true
  deck:
    attack_spells: 4
    attack_copies: 4
    heal_copies: 3
    blade_copies: 2
    trap_copies: 2
    shield_copies: 2
    core_copies: 2
    exclude: []               # spell names to never put in the deck
    include: {}               # e.g. {"Pixie": 2} to force a card in

# Deck searches (the combat simulator's deck building): never these cards.
deck_search:
  banned: [Dark Sprite, Vampire, Blinding Light, Earthquake]
  banned_schools: [death]   # the simulator overrates their hits
  allowed: [Feint]          # exceptions to banned_schools; minions are never allowed
