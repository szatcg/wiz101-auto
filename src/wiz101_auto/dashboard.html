<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral Progress</title>
<style>
  :root {
    --bg: #0e1020;
    --panel: #171a33;
    --panel-2: #1f2344;
    --line: #2d3260;
    --text: #e8e6f5;
    --muted: #9a9cc0;
    --gold: #f2c14e;
    --gold-soft: rgba(242, 193, 78, 0.14);
    --green: #5fd38d;
    --blue: #6fa8ff;
    --red: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 20% -10%, #262a5a 0%, var(--bg) 60%);
    background-color: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }

  /* ribbon: what the bot is doing now */
  .ribbon {
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(90deg, #3b2a6e, #23285a 60%, #1b3a5e);
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  .ribbon .wrap {
    display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
    padding-top: 12px; padding-bottom: 12px;
  }
  .state { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); }
  .dot.run { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dot.fight { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .now { min-width: 0; }
  .now .quest { font-size: 18px; font-weight: 700; color: var(--gold); overflow-wrap: anywhere; }
  .now .objective { color: var(--text); overflow-wrap: anywhere; font-size: 15px; margin-top: 2px; }
  .now .objective .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 6px; }
  .now .objective .age { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .thoughts li { display: flex; gap: 8px; align-items: baseline; }
  .thoughts .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .thoughts .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); color: var(--muted); white-space: nowrap; }
  @media (max-width: 640px) {
    .ribbon .wrap { grid-template-columns: 1fr; gap: 8px; }
    .vitals { text-align: left; }
    .hp { margin: 6px 0 0 0; }
  }
  .now .where { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .vitals { text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .vitals b { color: var(--text); font-size: 16px; }
  .hp { width: 160px; height: 8px; border-radius: 4px; background: #3a1d2a; margin: 6px 0 0 auto; overflow: hidden; }
  .hp > div { height: 100%; background: linear-gradient(90deg, #e44d6a, #ff8a7a); }

  h1 { font-size: 26px; margin: 28px 0 4px; letter-spacing: 0.3px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .overall {
    display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 20px;
  }
  .overall .big { font-size: 34px; font-weight: 800; color: var(--gold); }
  .overall .bar { flex: 1; min-width: 200px; }

  .progress { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; }
  .prow { display: grid; grid-template-columns: 150px 1fr 120px; gap: 14px; align-items: center; padding: 8px 0; }
  .prow + .prow { border-top: 1px solid var(--line); }
  .prow .label { font-weight: 700; }
  .prow .label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .prow .num { text-align: right; }
  .prow .num b { font-size: 20px; color: var(--gold); }
  .prow .num small { display: block; color: var(--muted); font-size: 12px; }
  .prow.total .label { font-size: 18px; }
  .prow.total .num b { font-size: 30px; }
  .prow.total .bar { height: 14px; }
  .prow.here .label { color: var(--gold); }
  .skull { color: var(--red); font-weight: 700; white-space: nowrap; }
  .arc-title { margin: 22px 0 10px; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .bar { height: 10px; border-radius: 6px; background: #0b0d1c; overflow: hidden; border: 1px solid var(--line); }
  .bar > div { height: 100%; background: linear-gradient(90deg, #c99a2e, var(--gold)); transition: width 0.6s; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; cursor: pointer; transition: transform 0.12s, border-color 0.12s;
    text-align: left; color: inherit; font: inherit;
  }
  .card:hover { transform: translateY(-2px); border-color: #4b5196; }
  .card.current { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 22px var(--gold-soft); }
  .card.open { background: var(--panel-2); }
  .card.locked { opacity: 0.55; }
  .card .name { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .card .pct { font-size: 24px; font-weight: 800; margin: 6px 0; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .badge.side { background: rgba(111, 168, 255, 0.15); color: var(--blue); }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }

  .detail {
    margin-top: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .detail h2 { margin: 0 0 4px; font-size: 20px; }
  .area { margin-top: 18px; }
  .area-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
  .area-head .bar { width: 160px; height: 6px; }
  .q {
    display: grid; grid-template-columns: 26px 34px 1fr; gap: 6px; align-items: start;
    padding: 7px 8px; border-radius: 8px;
  }
  .q:nth-child(odd) { background: rgba(255, 255, 255, 0.02); }
  .q.done .qname { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(154, 156, 192, 0.5); }
  .q.active { background: rgba(111, 168, 255, 0.10); }
  .q .num { color: var(--muted); font-size: 13px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: #262a50; color: #b9bce0; letter-spacing: 0.3px; }
  .tag.BOSS { background: #4a1f2e; color: #ffb0b0; }
  .tag.INSTANCE { background: #2a2250; color: #c7b6ff; }
  .tag.SIDE { background: #1f3a33; color: #9be3c0; }
  .icon { font-size: 15px; }
  .empty { color: var(--muted); }
  code { background: #0b0d1c; padding: 1px 6px; border-radius: 5px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .box h3 { margin: 0 0 8px; font-size: 15px; color: var(--gold); }
  .box ul { margin: 0; padding-left: 18px; }
  .box li { margin: 3px 0; overflow-wrap: anywhere; }
  .box li small { color: var(--muted); }

  @media (max-width: 720px) {
    .ribbon .wrap { grid-template-columns: 1fr; }
    .vitals { text-align: left; }
    .hp { margin-left: 0; }
    .cols { grid-template-columns: 1fr; }
    .prow { grid-template-columns: 1fr 90px; }
    .prow .bar { grid-column: 1 / -1; grid-row: 2; }
    .area-head .bar { width: 90px; }
  }
</style>
</head>
<body>
<div class="ribbon">
  <div class="wrap">
    <div class="state"><span class="dot" id="dot"></span><span id="state">connecting…</span></div>
    <div class="now">
      <div class="quest" id="quest">—</div>
      <div class="objective" id="objective"></div>
      <div class="where" id="where"></div>
    </div>
    <div class="vitals">
      <div>Level <b id="level">–</b> · Deaths <b id="deaths">–</b> <span id="deathsSession"></span></div>
      <div id="hptext"></div>
      <div class="hp"><div id="hpbar" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="wrap">
  <h1>Spiral Progress</h1>
  <p class="sub">Story quests completed per world. Updates every few seconds while the bot runs.</p>

  <div class="progress" id="progress"></div>

  <div id="worlds"></div>
  <div id="detail"></div>

  <div class="cols">
    <div class="box"><h3>Quest book</h3><ul id="book"></ul></div>
    <div class="box"><h3>Recently completed</h3><ul id="recent"></ul></div>
  </div>
  <div class="box thoughts"><h3>What the bot is doing</h3><ul id="thoughts"></ul></div>
</div>

<script>
const DATA_URL = "data.json";  // the published copy reads the repo's data branch instead
const STALE_SECONDS = 600;  // older data than this: the bot (or the publisher) is offline
let data = null;
let openWorld = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tagClass = (t) => t.startsWith("SIDE") ? "SIDE" : t.replace(/[^A-Z]/g, "");
const cleanTag = (t) => t.replace(/[^\x20-\x7E]/g, "×");

function renderRibbon() {
  const s = data.status || {};
  const dot = document.getElementById("dot");
  const age = Date.now() / 1000 - (data.updated || 0);
  const live = data.running && age < STALE_SECONDS;
  const fighting = live && s.in_battle;
  dot.className = "dot " + (fighting ? "fight" : live ? "run" : "");
  const ago = age < 3600 ? `${Math.round(age / 60)} min` : `${Math.round(age / 3600)} h`;
  document.getElementById("state").textContent = fighting ? "In battle" : live ? "Questing"
    : data.running ? `Offline · last update ${ago} ago` : "Bot stopped";
  document.getElementById("quest").textContent = data.current.quest || "No quest tracked";
  const obj = data.current.objective || "";
  const secs = data.current.objective_age_s;
  const stepAge = secs == null ? "" : secs < 90 ? "just now" : secs < 5400 ? `for ${Math.round(secs / 60)} min` : `for ${(secs / 3600).toFixed(1)} h`;
  document.getElementById("objective").innerHTML = obj
    ? `<span class="lbl">Current step</span>${esc(obj)}${stepAge ? `<span class="age">(${stepAge})</span>` : ""}` : "";
  const zone = (s.zone || "").split("/").slice(1).join(" › ").replace(/_/g, " ");
  document.getElementById("where").textContent = [data.current.world, zone].filter(Boolean).join(" · ");
  document.getElementById("level").textContent = s.level ?? "–";
  document.getElementById("deaths").textContent = data.deaths ? data.deaths.total : "–";
  document.getElementById("deathsSession").textContent =
    data.running && data.deaths && Date.now() / 1000 - data.updated < STALE_SECONDS
      ? `(${data.deaths.session} this session)` : "";
  const [hp, max] = String(s.health || "0/0").split("/").map(Number);
  document.getElementById("hptext").textContent = max ? `Health ${hp} / ${max}` : "";
  document.getElementById("hpbar").style.width = max ? `${Math.round((100 * hp) / max)}%` : "0%";
}

function renderWorlds() {
  const total = data.arcs.reduce((n, a) => n + a.total, 0);
  const done = data.arcs.reduce((n, a) => n + a.done, 0);
  const pct = total ? Math.round((100 * done) / total) : 0;
  const skull = (n) => n ? ` <span class="skull" title="deaths">💀 ${n}</span>` : "";
  const row = (cls, label, sub, p, d, t, deaths) => `<div class="prow ${cls}">
      <div class="label">${esc(label)}${skull(deaths)}<small>${esc(sub)}</small></div>
      <div class="bar"><div style="width:${p}%"></div></div>
      <div class="num"><b>${p}%</b><small>${t ? `${d} / ${t} quests` : "no lists yet"}</small></div>
    </div>`;
  document.getElementById("progress").innerHTML =
    row("total", "Overall", "every listed quest", pct, done, total, data.deaths ? data.deaths.total : 0) +
    data.arcs.map((a) => row(a.current ? "here" : "", a.name,
      `${a.worlds[0]} to ${a.worlds[a.worlds.length - 1]}` +
        (a.side_total ? ` · side worlds ${a.side_done}/${a.side_total}` : ""),
      a.pct, a.done, a.total, a.deaths)).join("");

  if (openWorld === null) openWorld = (data.worlds.find((w) => w.current) || data.worlds[0]).name;
  const card = (w) => {
    const cls = ["card", w.current ? "current" : "", w.name === openWorld ? "open" : "", !w.reached && !w.done ? "locked" : ""].join(" ");
    const meta = w.has_list ? `${w.done} / ${w.total} quests` : (w.reached ? "no quest list yet" : "not reached");
    return `<button class="${cls}" data-world="${esc(w.name)}">
      <div class="name"><span>${esc(w.name)}${skull(w.deaths)}</span>${w.current ? '<span class="badge">here</span>'
        : w.side ? '<span class="badge side">side</span>' : ""}</div>
      <div class="pct">${w.pct}%</div>
      <div class="bar"><div style="width:${w.pct}%"></div></div>
      <div class="meta">${meta}</div>
    </button>`;
  };
  const byName = Object.fromEntries(data.worlds.map((w) => [w.name, w]));
  document.getElementById("worlds").innerHTML = data.arcs.map((a) =>
    `<div class="arc-title">${esc(a.name)} · ${a.pct}%${skull(a.deaths)}</div>
     <div class="grid">${[...a.worlds, ...(a.side_worlds || [])].map((n) => byName[n]).filter(Boolean).map(card).join("")}</div>`).join("");
  document.querySelectorAll(".card").forEach((el) => el.addEventListener("click", () => {
    openWorld = el.dataset.world;
    render();
  }));
}

function renderDetail() {
  const w = data.worlds.find((x) => x.name === openWorld);
  const el = document.getElementById("detail");
  if (!w) { el.innerHTML = ""; return; }
  if (!w.has_list) {
    el.innerHTML = `<div class="detail"><h2>${esc(w.name)}</h2>
      <p class="empty">No quest list for ${esc(w.name)} yet. Paste its list from Spiral Tracker into
      <code>docs/quests/${esc(w.name)}.txt</code> (same format as <code>docs/QuestList.txt</code>) and it shows up here.</p></div>`;
    return;
  }
  const icon = { done: "✅", active: "🔷", todo: "⬜" };
  el.innerHTML = `<div class="detail"><h2>${esc(w.name)} — ${w.pct}%</h2>
    <div class="empty">${w.done} of ${w.total} quests done</div>
    ${w.areas.map((a) => {
      const p = a.total ? Math.round((100 * a.done) / a.total) : 0;
      return `<div class="area">
        <div class="area-head"><strong>${esc(a.name)}</strong>
          <span class="empty">${a.done}/${a.total} <span class="bar" style="display:inline-block;vertical-align:middle"><div style="width:${p}%"></div></span></span></div>
        ${a.quests.map((q) => `<div class="q ${q.status}">
          <span class="icon" title="${q.status}">${icon[q.status]}</span>
          <span class="num">${q.index}.</span>
          <div><div class="qname">${esc(q.name)}</div>
            <div class="tags">${q.tags.map((t) => `<span class="tag ${tagClass(t)}">${esc(cleanTag(t))}</span>`).join("")}</div></div>
        </div>`).join("")}
      </div>`;
    }).join("")}
  </div>`;
}

function renderLists() {
  const tracking = data.current.quest;
  document.getElementById("book").innerHTML = data.book.length
    ? data.book.map((q) => `<li>${q.name === tracking ? "<b>" + esc(q.name) + "</b>" : esc(q.name)}
        <small>${q.main ? "main" : q.spell ? "spell" : "side"}${q.area ? " · " + esc(q.area) : ""}</small></li>`).join("")
    : '<li class="empty">not read yet</li>';
  const th = data.thoughts || [];
  document.getElementById("thoughts").innerHTML = th.length
    ? th.map((e) => `<li><span class="t">${esc(e.time)}</span>${e.tag ? `<span class="tag">${esc(cleanTag(e.tag))}</span>` : ""}<span>${esc(e.say)}</span></li>`).join("")
    : '<li class="empty">nothing yet</li>';
  document.getElementById("recent").innerHTML = data.recent.length
    ? data.recent.map((n) => `<li>${esc(n)}</li>`).join("")
    : '<li class="empty">none yet</li>';
}

function render() {
  if (!data) return;
  renderRibbon();
  renderWorlds();
  renderDetail();
  renderLists();
}

async function poll() {
  try {
    const r = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
    data = await r.json();
    render();
  } catch (e) {
    document.getElementById("state").textContent = "dashboard server not running";
    document.getElementById("dot").className = "dot";
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
