<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizzbot Overlay</title>
<style>
  /* An OBS Browser Source: transparent page, one panel. Size the source
     about 560 x 250 and place it anywhere over the game capture. */
  :root {
    --panel: rgba(14, 16, 32, 0.82);
    --line: rgba(242, 193, 78, 0.55);
    --text: #f3f1ff;
    --muted: #b7b9dc;
    --gold: #f2c14e;
    --green: #5fd38d;
    --red: #ff6b6b;
  }
  html, body { margin: 0; background: transparent; }
  body {
    font: 600 18px/1.3 "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    padding: 8px;
  }
  .panel {
    width: 540px; box-sizing: border-box;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #777; }
  .dot.run { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.fight { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .stats { display: flex; gap: 14px; font-size: 16px; }
  .stats b { color: var(--gold); }
  .skull { color: var(--red); }
  .quest { margin-top: 8px; font-size: 20px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .objective { font-size: 16px; font-weight: 500; min-height: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: grid; grid-template-columns: 150px 1fr 54px; gap: 10px; align-items: center; margin-top: 8px; font-size: 15px; }
  .row .name { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .pct { text-align: right; color: var(--gold); }
  .bar { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #c99a2e, var(--gold)); transition: width 0.8s; }
  .hp > div { background: linear-gradient(90deg, #e44d6a, #ff8a7a); }
</style>
</head>
<body>
<div class="panel">
  <div class="top">
    <div class="state"><span class="dot" id="dot"></span><span id="state">connecting…</span></div>
    <div class="stats">
      <span>Lv <b id="level">–</b></span>
      <span class="skull">💀 <b id="deaths" style="color:var(--red)">–</b></span>
    </div>
  </div>
  <div class="quest" id="quest">—</div>
  <div class="objective" id="objective"></div>
  <div class="row"><span class="name" id="worldName">World</span><div class="bar"><div id="worldBar" style="width:0%"></div></div><span class="pct" id="worldPct">0%</span></div>
  <div class="row"><span class="name" id="arcName">Arc</span><div class="bar"><div id="arcBar" style="width:0%"></div></div><span class="pct" id="arcPct">0%</span></div>
  <div class="row"><span class="name" id="hpText">Health</span><div class="bar hp"><div id="hpBar" style="width:0%"></div></div><span class="pct" id="hpPct"></span></div>
</div>
<script>
const STALE_SECONDS = 120;
const set = (id, text) => { document.getElementById(id).textContent = text; };
const width = (id, pct) => { document.getElementById(id).style.width = `${Math.max(0, Math.min(100, pct))}%`; };

function render(d) {
  const s = d.status || {};
  const live = d.running && Date.now() / 1000 - (d.updated || 0) < STALE_SECONDS;
  const fighting = live && s.in_battle;
  document.getElementById("dot").className = "dot " + (fighting ? "fight" : live ? "run" : "");
  set("state", fighting ? "In battle" : live ? "Questing" : "Bot paused");
  set("level", s.level ?? "–");
  const world = d.worlds.find((w) => w.current) || null;
  set("deaths", d.deaths ? d.deaths.total : "–");
  set("quest", d.current.quest || "—");
  set("objective", d.current.objective || "");
  if (world) {
    set("worldName", `${world.name}${world.deaths ? "  💀" + world.deaths : ""}`);
    set("worldPct", `${world.pct}%`);
    width("worldBar", world.pct);
  }
  const arc = d.arcs.find((a) => a.current);
  if (arc) {
    set("arcName", arc.name);
    set("arcPct", `${arc.pct}%`);
    width("arcBar", arc.pct);
  }
  const [hp, max] = String(s.health || "0/0").split("/").map(Number);
  set("hpText", max ? `Health ${hp}/${max}` : "Health");
  set("hpPct", max ? `${Math.round((100 * hp) / max)}%` : "");
  width("hpBar", max ? (100 * hp) / max : 0);
}

async function poll() {
  try {
    const r = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    set("state", "tracker offline");
    document.getElementById("dot").className = "dot";
  }
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
