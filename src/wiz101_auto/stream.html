<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizzbot Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&family=Alegreya+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* A 1920x1080 OBS Browser Source. The game window (1440x810 at 20,20) is
     left transparent: put the game capture under this source. */
  :root {
    --bg: #0c0e1d;
    --panel: rgba(23, 26, 52, 0.92);
    --panel-2: rgba(33, 37, 72, 0.95);
    --line: #2f356a;
    --text: #eceaff;
    --muted: #9ea1c9;
    --gold: #f2c14e;
    --gold-2: #ffdf8a;
    --green: #5fd38d;
    --red: #ff6b6b;
    --blue: #6fa8ff;
    --violet: #b48cff;
    --teal: #4fd1c5;
    --orange: #ff9f5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: Inter, "Segoe UI", sans-serif; color: var(--text); }

  /* Everything but the game window gets the backdrop. */
  .backdrop {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 500px at 85% 10%, rgba(120, 90, 220, 0.28), transparent 60%),
      radial-gradient(900px 500px at 10% 100%, rgba(40, 120, 200, 0.22), transparent 60%),
      linear-gradient(160deg, #141735, var(--bg) 55%, #0a0b18);
    clip-path: path(evenodd, "M0 0 H1920 V1080 H0 Z M20 20 H1460 V830 H20 Z");
  }
  .frame {
    position: absolute; left: 14px; top: 14px; width: 1452px; height: 822px;
    border: 3px solid var(--gold); border-radius: 18px;
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.6) inset, 0 0 30px rgba(242, 193, 78, 0.35);
    pointer-events: none;
  }
  .frame .tag {
    position: absolute; top: -16px; left: 28px; padding: 3px 14px; border-radius: 999px;
    background: var(--gold); color: #1b1606; font: 900 15px Cinzel, serif; letter-spacing: 2px;
  }

  /* ---- sidebar ---- */
  .side { position: absolute; left: 1484px; top: 14px; width: 422px; height: 1052px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .farm .farmhead { display: flex; justify-content: space-between; align-items: baseline; }
  .farm .farmhead b { font-size: 26px; }
  .farm .set { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; }
  .farm .setname { flex: 1; color: var(--muted); }
  .farm .item { padding: 2px 8px; border-radius: 9px; border: 1px solid currentColor; opacity: 0.3; filter: grayscale(1); }
  .farm .item.have { opacity: 1; filter: none; color: #ffd75a; background: rgba(255, 215, 90, 0.18); }
  .brand { display: flex; align-items: center; justify-content: space-between; }
  .brand h1 { margin: 0; font: 900 34px Cinzel, serif; letter-spacing: 3px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold)); -webkit-background-clip: text; color: transparent; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.06); font-weight: 800; font-size: 15px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #777; }
  .dot.run { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dot.fight { background: var(--red); box-shadow: 0 0 12px var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .timers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .timer { background: rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 8px 12px; }
  .timer small, .label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .timer b { font: 800 26px Inter; font-variant-numeric: tabular-nums; }

  .vitals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
  .vital b { display: block; font: 800 30px Inter; }
  .vital.deaths b { color: var(--red); }
  .vital.level b { color: var(--gold); }
  .hp { margin-top: 10px; height: 14px; border-radius: 8px; background: #3a1d2a; overflow: hidden; }
  .hp > div { height: 100%; background: linear-gradient(90deg, #e44d6a, #ff8a7a); transition: width 0.6s; }
  .hptext { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 4px; }

  .quest-name { font: 700 22px Cinzel, serif; color: var(--gold-2); margin-top: 4px; line-height: 1.2; }
  .objective { margin-top: 8px; font-size: 17px; font-weight: 600; line-height: 1.35; }
  .where { margin-top: 6px; color: var(--muted); font-size: 13px; }

  .prog { display: grid; grid-template-columns: 110px 1fr 52px; gap: 10px; align-items: center; margin-top: 9px; font-size: 14px; }
  .prog .n { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog .p { text-align: right; font-weight: 800; color: var(--gold); }
  .bar { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #c99a2e, var(--gold)); transition: width 0.8s; }

  .book li { list-style: none; padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .book ul { margin: 6px 0 0; padding: 0; }
  .book .tracked { color: var(--gold-2); font-weight: 800; }
  .book small { color: var(--muted); }
  .grow { flex: 1; min-height: 0; overflow: hidden; }

  /* battle card */
  .battle { border-color: rgba(255, 107, 107, 0.6); box-shadow: 0 0 22px rgba(255, 107, 107, 0.18); }
  .battle .head { display: flex; justify-content: space-between; align-items: center; }
  .battle h3 { margin: 0; font: 900 20px Cinzel, serif; color: var(--red); letter-spacing: 1px; }
  .pips { display: flex; gap: 5px; }
  .pip { width: 16px; height: 16px; border-radius: 50%; background: #e6e6f5; box-shadow: 0 0 6px rgba(255,255,255,0.5); }
  .pip.power { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  img.pipimg { width: 20px; height: 20px; object-fit: contain; filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.35)); }
  .foe { margin-top: 10px; }
  .foe .fn { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
  .foe .fn .boss { color: var(--orange); }
  .foe .bar { position: relative; height: 14px; }
  .foe .bar > div { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, #b3263f, #ff5f6d); }
  .foe .bar > .hit { left: auto; background: repeating-linear-gradient(45deg, #ffe08a, #ffe08a 6px, #f2c14e 6px, #f2c14e 12px);
    box-shadow: 0 0 10px rgba(255, 224, 138, 0.9); animation: pulse 0.9s infinite; }
  .foe .dmg { color: var(--gold-2); font-weight: 800; margin-left: 6px; }
  .foe .ko { color: #10121f; background: var(--gold); border-radius: 5px; padding: 0 6px; margin-left: 6px; font-weight: 900; }
  .move { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); }
  .move .what { font-weight: 800; font-size: 16px; }
  .move .why { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .plan { margin-top: 8px; font-size: 13px; color: var(--teal); line-height: 1.35; }

  /* battle planner */
  .battle .head { gap: 8px; }
  .battle h3 { white-space: nowrap; }
  .battle .eta { white-space: nowrap; font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: rgba(79, 209, 197, 0.16); color: var(--teal); }
  .battle .eta.bad { background: rgba(255, 107, 107, 0.16); color: var(--red); }
  .battle .changed { margin-left: 6px; font: 800 11px Inter; letter-spacing: 1px; color: #10121f; background: var(--gold); border-radius: 6px; padding: 2px 6px; animation: pulse 0.8s 4; }
  .pfoe { margin-top: 9px; }
  .pfoe .fn { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
  .pfoe .fn .boss { color: var(--orange); }
  .pbar { position: relative; height: 16px; margin-top: 3px; border-radius: 8px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .pbar > span { position: absolute; top: 0; bottom: 0; }
  .pbar .keep { left: 0; background: linear-gradient(90deg, #b3263f, #ff5f6d); }
  .pbar .maybe { background: repeating-linear-gradient(45deg, #ffe08a, #ffe08a 5px, #f2c14e 5px, #f2c14e 10px); box-shadow: 0 0 8px rgba(255, 224, 138, 0.8); }
  .pbar .sure { background: rgba(255, 95, 109, 0.28); }
  .range { color: var(--gold-2); font-weight: 800; margin-left: 6px; }
  .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: 30px 66px 1fr; gap: 6px 8px; align-items: center; padding: 7px 9px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.04); border-left: 4px solid var(--muted); }
  .steps.fresh .step { animation: slide 0.4s ease-out; }  /* a new plan only, not every refresh */
  /* deck tracker: still to draw / in hand / used, per card */
  .deck { margin-top: 10px; }
  .deck .dh { display: flex; justify-content: space-between; font: 800 12px Inter; letter-spacing: 1px; color: var(--muted); }
  .deck .dl { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .deck .dc { font-size: 12px; padding: 2px 7px; border-radius: 7px; background: rgba(255, 255, 255, 0.06); white-space: nowrap; }
  .deck .dc b { color: var(--gold); }
  .deck .dc.out { opacity: 0.4; text-decoration: line-through; }
  .deck .dc .h { color: var(--teal); }
  .step.now { background: var(--panel-2); box-shadow: 0 0 14px rgba(242, 193, 78, 0.25); border-left-color: var(--gold); }
  .step .r { color: var(--muted); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .step .what { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .what em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 13px; }
  .step .after { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .step .after b { color: var(--text); font-weight: 700; }
  .step .after .ko { color: #10121f; background: var(--gold); border-radius: 4px; padding: 0 4px; font-weight: 900; }
  .cat { display: inline-block; text-align: center; padding: 2px 0; border-radius: 6px; font: 800 11px Inter; letter-spacing: 1px; color: #10121f; background: var(--muted); }
  .c-attack { background: var(--red); color: #fff; } .c-buff { background: var(--violet); color: #fff; } .c-debuff { background: var(--orange); }
  .c-heal { background: var(--green); } .c-shield { background: var(--teal); } .c-minion { background: #8c6cff; color: #fff; }
  .c-stun { background: var(--blue); } .c-prism { background: #ff7ad9; } .c-discard { background: #8a8fb8; } .c-wait { background: #5d6185; color: #fff; }
  .s-attack { border-left-color: var(--red); } .s-buff { border-left-color: var(--violet); } .s-debuff { border-left-color: var(--orange); }
  .s-heal { border-left-color: var(--green); } .s-shield { border-left-color: var(--teal); }
  .goal-label { margin-top: 10px; }
  .step .after .hitr { color: var(--gold-2); font-weight: 800; }
  body.fighting .progress-card { display: none; }

  /* the route to the objective's zone (outside fights, while travelling) */
  body.fighting .route-card { display: none; }
  .transit { font: 800 11px Inter; letter-spacing: 1.5px; padding: 3px 9px; border-radius: 999px;
    color: #10121f; background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .route { display: grid; margin-top: 12px; }
  .rnode { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .rnode::before { content: ""; position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: var(--line); }
  .rnode:first-child::before { display: none; }
  .rnode.passed::before, .rnode.here::before { background: var(--muted); }
  .rdot { position: relative; z-index: 1; width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel-2); border: 2px solid var(--line); }
  .rnode.passed .rdot { background: var(--muted); border-color: var(--muted); }
  .rnode.here .rdot { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 4px rgba(95, 211, 141, 0.25); }
  .rnode.dest .rdot { background: var(--gold); border-color: var(--gold); }
  .rnode.here.dest .rdot { background: var(--green); }
  .rname { margin-top: 6px; padding: 0 2px; font-size: 11px; line-height: 1.2; text-align: center; color: var(--muted);
    overflow-wrap: anywhere; }
  .rnode.here .rname { color: var(--green); font-weight: 800; }
  .rnode.dest .rname { color: var(--gold-2); font-weight: 800; }

  /* quest steps (outside fights) */
  .qhead { display: flex; justify-content: space-between; align-items: center; }
  .kind { font: 800 11px Inter; letter-spacing: 1.5px; padding: 3px 9px; border-radius: 999px; color: #10121f; }
  .kind.main { background: var(--gold); } .kind.side { background: var(--teal); }
  #qsteps { margin-top: 8px; }
  body.inbattle #qsteps .qstep.done, body.inbattle #qsteps .qstep.next { display: none; }
  body.inbattle #qsteps .qstep.now { animation: none; }
  .qstep { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; padding: 7px 9px; margin-top: 5px;
    border-radius: 10px; background: rgba(255, 255, 255, 0.03); font-size: 14px; line-height: 1.3; }
  .qstep .ic { text-align: center; font-weight: 900; }
  .qstep.done { color: var(--muted); }
  .qstep.done .tx { text-decoration: line-through; text-decoration-color: rgba(95, 211, 141, 0.8); text-decoration-thickness: 2px; }
  .qstep.done .ic { color: var(--green); }
  .qstep.now { background: var(--panel-2); border-left: 4px solid var(--gold); font-weight: 700; font-size: 15px;
    box-shadow: 0 0 14px rgba(242, 193, 78, 0.22); animation: slide 0.45s ease-out; }
  .qstep.now .ic { color: var(--gold); }
  .qstep.next { color: var(--muted); font-style: italic; }
  /* how long a step took (done) or has been going (now) */
  .qstep .dur { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums;
                text-decoration: none; display: inline-block; margin-left: 6px; white-space: nowrap; }
  .qstep.now .dur { color: var(--gold); }
  .critline { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* ---- deck tracker (the strip during a fight) ---- */
  .dtrack { position: absolute; left: 176px; right: 0; top: 0; bottom: 0; display: grid;
    grid-template-columns: 1.5fr 1.15fr 1.5fr 0.85fr; gap: 6px; }  /* (played as wide as in deck: long fights ran off the bottom) */
  .dcol { background: var(--panel); border-radius: 12px; padding: 8px 12px; overflow: hidden; }
  .dcol h4 { margin: 0 0 6px; font: 800 13px Inter; letter-spacing: 1.5px; color: var(--muted);
    display: flex; justify-content: space-between; }
  .dcol h4 .dig { color: var(--gold); letter-spacing: 0.5px; }
  .dchips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { position: relative; font-size: 14px; padding: 4px 9px; border-radius: 8px; background: rgba(255, 255, 255, 0.07);
    white-space: nowrap; border: 1px solid transparent; }
  .chip b { color: var(--gold-2); margin-left: 4px; }
  .chip.want { border-color: var(--gold); background: rgba(242, 193, 78, 0.16); box-shadow: 0 0 12px rgba(242, 193, 78, 0.45); }
  .chip .odds { position: absolute; top: -9px; right: -6px; font: 800 11px Inter; color: #10121f; background: var(--gold);
    border-radius: 6px; padding: 1px 5px; }
  .chip.used { opacity: 0.45; }
  /* card art (docs/spell_images via /cards/) */
  .art { position: relative; display: inline-block; height: 84px; }
  .art img { height: 84px; border-radius: 6px; display: block; }
  .art .cnt { position: absolute; right: 2px; bottom: 2px; font: 900 15px Inter; color: #fff;
    background: rgba(16, 18, 31, 0.85); border-radius: 6px; padding: 0 5px; }
  .art.want img { outline: 3px solid var(--gold); box-shadow: 0 0 14px rgba(242, 193, 78, 0.8); }
  .art .odds { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font: 800 11px Inter;
    color: #10121f; background: var(--gold); border-radius: 6px; padding: 1px 5px; white-space: nowrap; }
  .art.used img { opacity: 0.4; filter: grayscale(0.7); }
  /* ---- thoughts strip ---- */
  .thoughts { position: absolute; left: 14px; top: 852px; width: 1452px; height: 214px; }
  .thoughts .title { position: absolute; left: 0; top: 0; width: 170px; height: 100%; display: flex; flex-direction: column;
    justify-content: center; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
  .thoughts .title b { font: 900 22px Cinzel, serif; color: var(--gold); line-height: 1.1; }
  .thoughts .title span { font-size: 42px; margin-bottom: 6px; }
  .feed { position: absolute; left: 184px; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column-reverse; gap: 7px; overflow: hidden; }
  .ev { display: grid; grid-template-columns: 40px 76px 1fr; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-radius: 12px; border-left: 5px solid var(--muted); animation: slide 0.45s ease-out; }
  .ev:last-child { background: var(--panel-2); box-shadow: 0 0 14px rgba(242, 193, 78, 0.18); }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  .ev .ic { font-size: 22px; text-align: center; }
  .ev .t { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ev .m { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .m em { font-style: normal; color: var(--muted); font-size: 14px; }
  .ev .m b { color: var(--gold-2); }
  .k-cast { border-left-color: var(--red); } .k-discard { border-left-color: #8a8fb8; } .k-pass { border-left-color: #6d7195; }
  .k-plan { border-left-color: var(--teal); } .k-travel { border-left-color: var(--blue); } .k-heal { border-left-color: var(--green); }
  .k-loot { border-left-color: var(--gold); } .k-mark, .k-recall { border-left-color: var(--violet); } .k-hunt { border-left-color: var(--orange); }
  .k-quest, .k-success { border-left-color: var(--gold); } .k-warning, .k-flee { border-left-color: var(--orange); }
  .k-talk { border-left-color: #7fd6ff; } .k-train { border-left-color: var(--violet); }
  .tag { display: inline-block; min-width: 72px; margin-right: 10px; padding: 2px 8px; border-radius: 6px; text-align: center;
    font: 800 12px Inter; letter-spacing: 1.2px; color: #10121f; background: var(--muted); vertical-align: 2px; }
  .t-FINISH, .t-KILL, .t-ATTACK, .t-FREE { background: var(--red); color: #fff; }
  .t-SETUP, .t-BOOST, .t-PRISM, .t-BREAK { background: var(--violet); color: #fff; }
  .t-WAIT, .t-PLAN { background: var(--teal); }
  .t-TOSS { background: #8a8fb8; }
  .t-HEAL, .t-SHIELD { background: var(--green); }
  .t-SUMMON, .t-MARK, .t-RECALL { background: var(--violet); color: #fff; }
  .t-HUNT, .t-FLEE, .t-HMM { background: var(--orange); }
  .t-TRAVEL, .t-TALK, .t-COLLECT { background: var(--blue); }
  .t-LOOT, .t-DONE, .t-QUEST, .t-YES { background: var(--gold); }
  .move .what .tag { font-size: 13px; }
</style>
<style>
  /* ===== Wizard101 look: parchment panels in wood-and-gold frames, red
     ribbons, the night sky around the game window, NPC-style dialog for the
     bot's thoughts. Layered over the base styles above. ===== */
  :root {
    --text: #3a2612;
    --muted: #7a5c36;
    --line: #a8895a;
    --gold: #c8962a;
    --gold-2: #7d2414;
    --green: #2f8a4c;
    --red: #b3261e;
    --blue: #2b5fa8;
    --violet: #6d3fa3;
    --teal: #1e7d76;
    --orange: #c0661c;
    --parch: radial-gradient(ellipse at 25% 15%, #f6ead0 0%, #ead7ad 45%, #dcc28c 100%);
    --parch-2: rgba(122, 82, 30, 0.10);
    --wood: #4f3115;
    --trim: #d9b25a;
  }
  body { font-family: "Alegreya Sans", Inter, sans-serif; }
  .backdrop { background: url("/ui/sky.jpg") center / cover no-repeat, #142a5c; }
  .frame { border: 6px solid var(--wood); border-radius: 14px;
    box-shadow: inset 0 0 0 2px var(--trim), 0 0 0 2px var(--trim), 0 6px 24px rgba(0, 0, 0, 0.6); }
  .frame .tag { top: -19px; border-radius: 4px; padding: 3px 16px; color: #ffe9a8;
    background: linear-gradient(180deg, #b0291f, #74150f); border: 2px solid var(--trim);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5); text-shadow: 0 1px 0 #3d0a06; }

  /* parchment cards */
  .card, .dcol {
    background: var(--parch); color: var(--text);
    border: 4px solid var(--wood); border-radius: 12px;

<div class="backdrop"></div>

<div class="side">

    <div class="route" id="route"></div>

    <span class="label">Progress</span>
    <div class="prog"><span class="n" id="wName">World</span><div class="bar"><div id="wBar"></div></div><span class="p" id="wPct">0%</span></div>
    <div class="prog"><span class="n" id="aName">Arc</span><div class="bar"><div id="aBar"></div></div><span class="p" id="aPct">0%</span></div>
    <div class="prog"><span class="n">Spiral</span><div class="bar"><div id="oBar"></div></div><span class="p" id="oPct">0%</span></div>
  </div>

  <div class="card farm" id="farm" style="display:none">
    <div class="farmhead"><span class="label" id="farmName">Farming</span><b id="farmRuns">0</b></div>
    <div id="farmLoot"></div>
  </div>

  <div class="card grow" id="lower"></div>
</div>

<div class="card bestdraw" id="bestDraw" style="display:none">
  <span class="label">Best Draw</span>
  <div id="bdList"></div>
</div>
<div class="bdfloat" id="bdFloat"></div>

<div class="thoughts">
  <div class="dialog">
    <div class="portrait"><img src="/ui/portrait.png" alt=""></div>
    <div class="pipring" id="pipring"></div>
    <div class="dname" id="stripTitle">Wizzbot</div>
    <div class="feed" id="feed"></div>
    <div class="dbtn" id="dbtn">THINKING</div>
  </div>
</div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);
const clock = (sec) => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
};
const ICONS = { cast: "⚔️", discard: "🗑️", pass: "⏳", enchant: "✨", plan: "🧮", travel: "🧭", heal: "💚", loot: "💎",
  mark: "📍", recall: "🌀", hunt: "🎯", quest: "📜", success: "✅", warning: "⚠️", flee: "🏃", talk: "💬", train: "📚", info: "•" };

let data = null, thoughts = null, battle = null, fetchedAt = 0;

function renderSide() {
  const s = data.status || {};
  const live = data.running && Date.now() / 1000 - (data.updated || 0) < 120;
  const fight = live && s.in_battle;
  $("dot").className = "dot " + (fight ? "fight" : live ? "run" : "");
  const farm = s.farm;
  const farming = !!(farm && farm.active);
  $("state").textContent = fight ? "IN BATTLE" : live ? (farming ? "FARMING" : "QUESTING") : "PAUSED";
  $("farm").style.display = farming ? "" : "none";
  if (farming) {
    $("farmName").textContent = `Farming ${farm.dungeon} · runs`;
    $("farmRuns").textContent = farm.runs;
    const targets = farm.targets || [];
    const groups = [...new Set(targets.map((t) => t.group))];
    $("farmLoot").innerHTML = groups.map((g) => `<div class="set"><span class="setname">${esc(g)}</span>${
      targets.filter((t) => t.group === g).map((t) =>
        `<span class="item${t.have ? " have" : ""}" title="${esc(t.name)}">${esc(t.slot)}</span>`).join("")}</div>`).join("");
  }
  $("level").textContent = s.level ?? "–";
  $("deaths").textContent = data.deaths ? data.deaths.total : "–";
  $("sdeaths").textContent = data.deaths ? data.deaths.session : "–";
  const [hp, max] = String(s.health || "0/0").split("/").map(Number);
  $("hp").style.width = max ? `${(100 * hp) / max}%` : "0%";
  $("hptext").textContent = max ? `${hp} / ${max}` : "";
  $("quest").textContent = data.current.grinding ? "Grinding for experience" : (data.current.quest || "—");
  const main = data.current.main;
  // Main or side quest: a power pip or a plain pip in the box's corner (the
  // game's own pips; a text pill looked too modern).
  $("kind").className = "kind " + (main ? "main" : "side");
  const kindHtml = main == null || data.current.grinding ? ""
    : `<img class="qpip" src="/pips/${main ? "Power_Pip.png" : "Pip.png"}" alt="${main ? "main quest" : "side quest"}">`;
  if ($("kind").innerHTML !== kindHtml) $("kind").innerHTML = kindHtml;
  $("kind").style.display = kindHtml ? "" : "none";
  renderSteps();
  renderRoute();
  const zone = ((s.zone || "").split("/").slice(1).pop() || "")
    .replace(/^[A-Z]{2}_/, "").replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2");
  $("where").textContent = [data.current.world, (data.sides || {}).area || zone].filter(Boolean).join(" · ");
  const w = data.worlds.find((x) => x.current);
  if (w) { $("wName").textContent = w.name; $("wPct").textContent = `${w.pct}%`; $("wBar").style.width = `${w.pct}%`; }
  const a = data.arcs.find((x) => x.current);
  if (a) { $("aName").textContent = a.name; $("aPct").textContent = `${a.pct}%`; $("aBar").style.width = `${a.pct}%`; }
  const tot = data.arcs.reduce((n, x) => n + x.total, 0), done = data.arcs.reduce((n, x) => n + x.done, 0);
  const op = tot ? Math.round((100 * done) / tot) : 0;
  $("oPct").textContent = `${op}%`; $("oBar").style.width = `${op}%`;
}

const CAT = { attack: "ATTACK", buff: "BUFF", debuff: "DEBUFF", heal: "HEAL", shield: "SHIELD", minion: "MINION",
  stun: "STUN", prism: "PRISM", discard: "DISCARD", wait: "WAIT", other: "MOVE" };
const shortName = (n) => (n.length > 14 ? n.split(" ").map((w, i, a) => (i < a.length - 1 ? w[0] + "." : w)).join(" ") : n);
const range = (lo, hi) => (lo === hi ? `${lo}` : `${lo}–${hi}`);
let lastPlanKey = "", lastPlanRound = null, planChangedAt = 0, lastPlannerHtml = "", planFreshUntil = 0;

function renderPlanner(p) {
  const steps = p.steps || [];
  const first = steps[0];
  const key = JSON.stringify(steps.map((s) => [s.round, s.kind, s.spell, s.target]));
  if (key !== lastPlanKey) {
    if (lastPlanKey && lastPlanRound === p.round) planChangedAt = Date.now();  // same round, new plan: it changed its mind
    lastPlanKey = key;
    lastPlanRound = p.round;
    planFreshUntil = Date.now() + 500;  // slide the rows in once
  }
  const changed = Date.now() - planChangedAt < 6000 ? '<span class="changed">PLAN CHANGED</span>' : "";
  const eta = p.rounds ? `<span class="eta">≈ ${p.rounds} round${p.rounds === 1 ? "" : "s"} to win</span>`
            : p.lost ? `<span class="eta bad">on course to lose</span>`
            : `<span class="eta">${p.horizon || 12}+ rounds</span>`;
  const foes = (p.enemies || []).map((e, i) => {
    if (e.hp <= 0) return "";
    const after = first && first.after[i] ? first.after[i] : [e.hp, e.hp];
    const dmg = first && first.dmg[i];
    const pct = (v) => (e.max ? (100 * v) / e.max : 0);
    const label = !dmg ? "" : after[1] === 0 ? '<span class="ko">KO</span>' : after[0] === 0 ? '<span class="range">KO?</span>'
                : `<span class="range">−${range(dmg[0], dmg[1])}</span>`;
    return `<div class="pfoe"><div class="fn"><span class="${e.boss ? "boss" : ""}">${e.boss ? "👑 " : ""}${esc(e.name)}</span>
      <span>${e.hp} / ${e.max}${label}</span></div>
      <div class="pbar"><span class="keep" style="width:${pct(after[0])}%"></span>
        <span class="maybe" style="left:${pct(after[0])}%; width:${pct(after[1] - after[0])}%"></span>
        <span class="sure" style="left:${pct(after[1])}%; width:${pct(e.hp - after[1])}%"></span></div></div>`;
  }).join("");
  const rows = steps.slice(0, 7).map((s, idx) => {
    const tgt = s.target ? ` <em>→ ${esc(s.target)}</em>` : "";
    const hit = s.dmg.find((d) => d);
    const what = s.kind === "wait" ? "Save pips" : s.kind === "discard" ? `Toss ${esc(s.spell)}` : esc(s.spell);
    const after = (p.enemies || []).map((e, i) => {
      if (e.hp <= 0) return "";
      const [lo, hi] = s.after[i];
      return hi === 0 ? `<span>${esc(shortName(e.name))} <span class="ko">KO</span></span>`
                      : `<span>${esc(shortName(e.name))} <b>${range(lo, hi)}</b></span>`;
    }).join("");
    return `<div class="step s-${s.kind}${idx === 0 ? " now" : ""}"><span class="r">R${s.round}</span>
      <span class="cat c-${s.kind}">${CAT[s.kind] || "MOVE"}</span>
      <span class="what">${what}${tgt}</span>
      ${hit || idx === 0 ? `<div class="after">${hit ? `<span class="hitr">💥 ${range(hit[0], hit[1])}</span>` : ""}${after}</div>` : ""}</div>`;
  }).join("");
  // Redrawn only when something changed: rebuilding it every poll replayed
  // the rows' slide-in every couple of seconds.
  const fresh = Date.now() < planFreshUntil ? " fresh" : "";
  const html = `<div class="head"><h3>⚔️ Round ${p.round}${changed}</h3>${eta}</div>
    ${foes}<div class="steps${fresh}">${rows}</div>`;
  if (html === lastPlannerHtml && $("lower").className === "card grow battle") return;
  lastPlannerHtml = html;
  $("lower").className = "card grow battle";
  $("lower").innerHTML = html;
}

// The pips around the portrait, as the game draws them around a duelist:
// from 12 o'clock, centred on it, close together; class pips on the left,
// then power pips, then plain ones. Only during fights.
const PIP_RADIUS = 86, PIP_STEP = 27;  // (44 px pips, touching like the game's)  // px from the portrait's centre; degrees between pips
let lastRing = "";
function renderPipRing(b) {
  let html = "";
  if (b) {
    const cls = b.school || {};
    const mine = b.myschool;
    const cap = (k) => k.charAt(0).toUpperCase() + k.slice(1);
    const off = Object.entries(cls).filter(([k]) => k !== mine).reduce((t, [, n]) => t + n, 0);
    const pips = [];
    for (const [k, n] of Object.entries(cls)) for (let i = 0; i < n; i++) pips.push(`${cap(k)}_School_Pip.png`);
    for (let i = 0; i < (b.power || 0) - (cls[mine] || 0); i++) pips.push("Power_Pip.png");
    for (let i = 0; i < (b.pips || 0) - off; i++) pips.push("Pip.png");
    html = pips.map((f, i) => {
      const a = ((i - (pips.length - 1) / 2) * PIP_STEP * Math.PI) / 180;
      const x = PIP_RADIUS * Math.sin(a), y = -PIP_RADIUS * Math.cos(a);
      return `<img src="/pips/${f}" alt="" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px">`;
    }).join("");
  }
  if (html !== lastRing) { lastRing = html; $("pipring").innerHTML = html; }
}

function renderLower() {
  const s = (data && data.status) || {};
  const planning = !!(battle && battle.active && s.in_battle);
  document.body.classList.toggle("fighting", planning);  // the plan gets the progress card's room
  document.body.classList.toggle("inbattle", !!s.in_battle);
  $("lower").style.display = "";
  $("questCard").classList.toggle("grow", !s.in_battle);
  renderPipRing(planning ? battle : (s.in_battle && thoughts && thoughts.battle) || null);
  if (planning) { renderPlanner(battle); return; }
  lastPlannerHtml = "";  // (another card in its place: the plan is drawn again next time)
  const b = thoughts && thoughts.battle;
  if (b && s.in_battle) {
    const predict = b.predict || {};
    const crits = b.crit || {};
    const foes = b.enemies.map((e, i) => [e, predict[i] || 0, crits[i]]).filter(([e]) => !e.dead).map(([e, dmg, cr]) => {
      const hpPct = e.max ? (100 * e.hp) / e.max : 0;
      const hitPct = e.max ? (100 * Math.min(dmg, e.hp)) / e.max : 0;
      const after = hpPct - hitPct;
      const mark = !dmg ? "" : dmg >= e.hp ? '<span class="ko">KO</span>' : `<span class="dmg">−${dmg}</span>`;
      return `<div class="foe"><div class="fn"><span class="${e.boss ? "boss" : ""}">${e.boss ? "👑 " : ""}${esc(e.name)}</span>
        <span>${e.hp} / ${e.max}${mark}</span></div>
        <div class="bar"><div style="width:${after}%"></div>${dmg ? `<div class="hit" style="left:${after}%; width:${hitPct}%"></div>` : ""}</div>
        ${cr && cr.c ? `<div class="critline">💥 crit ${cr.c}% · blocks ${cr.b}% · ${cr.n} → ${cr.x} on a crit${cr.x >= e.hp && cr.n < e.hp ? ' <span class="ko">KO on a crit</span>' : ""}</div>` : ""}</div>`;
    }).join("");
    const what = `${b.tag ? `<span class="tag t-${b.tag}">${b.tag}</span>` : ""}${esc(b.say || b.card)}`;
    $("lower").className = "card grow battle";
    $("lower").innerHTML = `<div class="head"><h3>⚔️ Round ${b.round}</h3></div>
      ${foes}
      <div class="move"><span class="label">Wizzbot's move</span><div class="what">${what}</div></div>
      ${b.plan ? `<div class="plan">🧮 Plan: ${esc(b.plan.replaceAll(" > ", " → ").split(" | ").join(" · ").replace(/; skipping the minion.*/, ""))}</div>` : ""}`;
    return;
  }
  $("lower").style.display = "none";  // outside fights the quest card takes the room
  $("questCard").classList.add("grow");
}

function renderRoute() {
  // The zones the bot means to cross to the objective: passed (grey), here
  // (green), on the way, the destination (yellow). None once there.
  const r = data.route || {};
  const zones = r.zones || [];
  $("routeCard").style.display = zones.length > 1 ? "" : "none";
  if (zones.length < 2) return;
  const at = Math.min(r.at || 0, zones.length - 1);
  const html = zones.map((z, i) => {
    const cls = ["rnode", i < at ? "passed" : "", i === at ? "here" : "", i === zones.length - 1 ? "dest" : ""];
    return `<div class="${cls.join(" ")}"><span class="rdot"></span><span class="rname">${esc(z.name)}</span></div>`;
  }).join("");
  const el = $("route");
  el.style.gridTemplateColumns = `repeat(${zones.length}, minmax(0, 1fr))`;
  if (el.innerHTML !== html) el.innerHTML = html;
}

function fmtDur(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}:${String(sec).padStart(2, "0")}`;
}

// The current step's timer ticks between data refreshes.
setInterval(() => {
  const el = document.getElementById("nowdur");
  if (el) el.textContent = fmtDur(Date.now() / 1000 - Number(el.dataset.since));
}, 1000);

function renderSteps() {
  const st = (data && data.steps) || {};
  const nowText = data.current.grinding ? "No quest to do right now: fighting for experience"
                                        : (st.now || data.current.objective || "");
  const times = data.step_times || {};
  const took = times.took || {};
  const done = (st.done || []).slice(-8).map((t) =>
    `<div class="qstep done"><span class="ic">✓</span><span class="tx">${esc(t)}` +
    (took[t] != null ? `</span><span class="dur">${fmtDur(took[t])}</span>` : "</span>") + `</div>`).join("");
  const since = data.current.grinding ? null : times.since;
  const now = nowText ? `<div class="qstep now"><span class="ic">▶</span><span class="tx">${esc(nowText)}</span>` +
    (since ? `<span class="dur" id="nowdur" data-since="${since}"></span>` : "") +
    `</div>` : "";
  const next = (st.next || []).slice(0, 5).map((t) =>
    `<div class="qstep next"><span class="ic">○</span><span class="tx">${esc(t)}</span></div>`).join("");
  const qhtml = done + now + next;  // (only on change: a redraw replays the slide-in)
  if ($("qsteps").dataset.html !== qhtml) { $("qsteps").dataset.html = qhtml; $("qsteps").innerHTML = qhtml; }
  const nd = document.getElementById("nowdur");  // (its text outside the html compared above)
  if (nd) nd.textContent = fmtDur(Date.now() / 1000 - Number(nd.dataset.since));
}

function describe(e) {
  const tag = e.tag ? `<span class="tag t-${e.tag}">${e.tag}</span>` : "";
  const round = e.round != null ? `<em>R${e.round} · </em>` : "";
  return `${tag}${round}${esc(e.say || e.text)}`;
}

// Pips as the game draws them (docs/pip_images): plain, power, and class
// pips by school. Our school's class pips are counted in `power`, other
// schools' in `pips` (how they're spent); here each shows as itself.
function pipRow(pips, power, school, myschool) {
  const cls = school || {};
  const img = (f) => `<img class="pipimg" src="/pips/${f}" alt="">`;
  const rep = (n, f) => (n > 0 ? img(f).repeat(n) : "");
  const off = Object.entries(cls).filter(([k]) => k !== myschool).reduce((t, [, n]) => t + n, 0);
  const cap = (k) => k.charAt(0).toUpperCase() + k.slice(1);
  return rep((pips || 0) - off, "Pip.png") + rep((power || 0) - (cls[myschool] || 0), "Power_Pip.png") +
    Object.entries(cls).map(([k, n]) => rep(n, `${cap(k)}_School_Pip.png`)).join("");
}


// ---- The game's own fonts ----
// Wizard101 draws its text from bitmap fonts (Root.wad: Fonts/WizardFancy for
// titles and names, WizardNormal for dialog text): texture pages of white
// letters plus each letter's box and spacing (docs/ui_images/fonts, exported
// from the game). Text on this page is redrawn with them: each letter a
// span masked by its piece of the page, filled with the text colour.
const FONTS = {};
let fontsReady = false;
const FANCY = "h1, h3, h4, .label, .dname, .quest-name, .dbtn, .tag, .kind, .transit, .cat, .timer b, .vital b, " +
  ".pill, .eta, .changed, .r, .cnt, .odds, .ko, .rname, .prog .p, .prog .n, .frame .tag, .range, .hitr, .bdsay";
const CELL = { WizardFancy: 44, WizardNormal: 40 };
Promise.all(["WizardFancy", "WizardNormal"].map((f) =>
  fetch(`/ui/fonts/${f}.json`).then((r) => r.json()).then((d) => { FONTS[f] = d; })))
  .then(() => { fontsReady = true; gameText(document.body); })
  .catch(() => {});  // (no fonts: the page keeps its web fonts)

function glyph(font, code, k) {
  const f = FONTS[font];
  const g = f.glyphs[code];
  if (!g) return null;
  const [pg, left, top, w, h, a, b, c] = g;
  const padL = Math.floor((w - b) / 2), padR = w - b - padL;
  const s = document.createElement("span");
  s.className = "gg";
  s.style.cssText = `width:${w * k}px;height:${h * k}px;margin:0 ${(c - padR) * k}px 0 ${(a - padL) * k}px;` +
    `-webkit-mask:url(/ui/fonts/${f.pages[pg]}) ${-left * k}px ${-top * k}px/${f.size[0] * k}px ${f.size[1] * k}px no-repeat;` +
    `mask:url(/ui/fonts/${f.pages[pg]}) ${-left * k}px ${-top * k}px/${f.size[0] * k}px ${f.size[1] * k}px no-repeat;`;
  return s;
}

function gameText(root) {
  if (!fontsReady || !root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentElement;
      // (Not the ticking step timer: re-set as plain text every second, then
      // redrawn here every poll, it changed size and the quest box jumped.)
      if (!p || !n.nodeValue.trim() || p.closest("script, style, .gt, title, .dur")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const p = n.parentElement;
    const font = p.closest(FANCY) ? "WizardFancy" : "WizardNormal";
    const k = (parseFloat(getComputedStyle(p).fontSize) * 1.3) / CELL[font];
    const out = document.createElement("span");
    out.className = "gt";
    for (const part of n.nodeValue.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { out.appendChild(document.createTextNode(" ")); continue; }
      const word = document.createElement("span");
      word.className = "gw";
      for (const ch of part) {
        const g = glyph(font, ch.codePointAt(0), k);
        word.appendChild(g || document.createTextNode(ch));  // (a letter the game font lacks: as it was)
      }
      out.appendChild(word);
    }
    p.replaceChild(out, n);
  }
}


// ---- Best Draw: the cards still in the deck that would shorten the fight,
// in a small panel over the game's corner; when a round starts, whether the
// one dug for was drawn (rising text, green or red) ----
let bdTurn = null;   // the round's wish list, as of the start of our turn: {round, cards, hand}
function renderBestDraw(p, inBattle) {
  // Read at the start of our turn (the first plan of a new round) and kept
  // until the next turn starts, through the enemies' moves; when the round
  // changes, whether the card dug for came (rising green or red text).
  const panel = $("bestDraw");
  if (!inBattle) { bdTurn = null; panel.style.display = "none"; return; }
  if (p && p.active && (p.deck || []).length && (!bdTurn || p.round !== bdTurn.round)) {
    const imp = p.improve || {};
    const cards = Object.entries(imp.cards || {})
      .map(([name, w]) => ({ name, saves: (imp.base || 0) - w.rounds, odds: w.odds }))
      .filter((c) => c.saves > 0)
      .sort((a, b) => b.saves - a.saves || b.odds - a.odds)
      .slice(0, 3);
    const hand = Object.fromEntries((p.deck || []).map((r) => [r.name, r.hand]));
    if (bdTurn && p.round > bdTurn.round && bdTurn.cards.length) {
      const got = bdTurn.cards.find((c) => (hand[c.name] || 0) > (bdTurn.hand[c.name] || 0));
      if (got) bdSay(`Drew ${got.name}! −${got.saves} round${got.saves === 1 ? "" : "s"}`, true);
      else bdSay(`No ${bdTurn.cards[0].name} this round`, false);
    }
    bdTurn = { round: p.round, cards, hand };
  }
  const cards = (bdTurn && bdTurn.cards) || [];
  panel.style.display = cards.length ? "" : "none";
  if (!cards.length) return;
  const html = cards.map((c) => {
    const art = cardArt(c.name);
    const pic = art ? `<img src="/cards/${art}" alt="">` : "";
    return `<div class="bd">${pic}<div class="bdt"><div class="bdn">${esc(c.name)}</div>` +
      `<div class="bds">−${c.saves} round${c.saves === 1 ? "" : "s"} · ${c.odds}% next draw</div></div></div>`;
  }).join("");
  if ($("bdList").dataset.html !== html) { $("bdList").dataset.html = html; $("bdList").innerHTML = html; }
}
function bdSay(text, good) {
  const el = document.createElement("div");
  el.className = "bdsay " + (good ? "good" : "bad");
  el.textContent = text;
  $("bdFloat").appendChild(el);
  gameText(el);
  setTimeout(() => el.remove(), 3200);
}

let trackerHtml = "", cardIndex = null;
fetch("/cards/index.json").then((r) => r.json()).then((d) => { cardIndex = d; trackerHtml = ""; }).catch(() => {});
function cardArt(name) {  // the card's art file (docs/spell_images), or null: shown as text
  if (!cardIndex) return null;
  // A card from gear or a pet ("Tower Shield - Amulet"): the spell's own art.
  const base = String(name).split(" - ")[0];
  const hit = cardIndex[base.toLowerCase().replace(/[^a-z0-9]/g, "")];
  return hit ? hit.file : null;
}
function renderTracker() {
  const p = battle || {};
  const deck = p.deck || [];
  // Cards that would shorten the win if drawn: glowing, with the chance of
  // drawing each next round and the rounds the win would take with it.
  const imp = p.improve || {};
  const better = imp.cards || {};
  const chips = (rows, field, cls) => rows.filter((r) => r[field] > 0).map((r) => {
    const w = field === "left" ? better[r.name] : null;
    const odds = "";  // (the draw odds are in the Best Draw panel)
    const art = cardArt(r.name);
    if (art) {
      return `<span class="art ${cls}${w ? " want" : ""}" title="${esc(r.name)}"><img src="/cards/${art}" alt="">${
        odds}<span class="cnt">×${r[field]}</span></span>`;
    }
    return `<span class="chip ${cls}${w ? " want" : ""}"${w ? ` title="win in ${w.rounds} rounds with it"` : ""}>${
      esc(r.name)}<b>×${r[field]}</b>${odds}</span>`;
  }).join("");
  const n = (field) => deck.reduce((t, r) => t + r[field], 0);
  const plan = imp.base && imp.base < 99 ? `win in ~${imp.base}` : "";
  const digNote = "";  // (see the Best Draw panel)
  const html = `<div class="dtrack">
    <div class="dcol"><h4><span>IN DECK · ${n("left")}</span>${digNote}</h4><div class="dchips">${chips(deck, "left", "")}</div></div>
    <div class="dcol"><h4><span>IN HAND · ${n("hand")}</span></h4><div class="dchips">${chips(deck, "hand", "")}</div></div>
    <div class="dcol"><h4><span>PLAYED · ${n("played")}</span></h4><div class="dchips">${chips(deck, "played", "used")}</div></div>
    <div class="dcol"><h4><span>DISCARDED · ${n("discarded")}</span></h4><div class="dchips">${
      chips(deck, "discarded", "used")}</div></div></div>`;
  if (html !== trackerHtml) { trackerHtml = html; $("feed").innerHTML = html; }
}

function stripMode(fighting) {
  const t = $("stripTitle");
  const want = fighting ? "deck" : "thoughts";
  if (t.dataset.mode === want) return;
  t.dataset.mode = want;
  t.textContent = "Wizzbot";
  document.body.classList.toggle("fighting-strip", fighting);
  trackerHtml = ""; lastFeed = "";
}

function renderFeed() {
  // Like an NPC's dialog: the newest thought spoken, the few before it below,
  // and the kind of thought on the dialog's button.
  const evs = (thoughts && thoughts.events) || [];
  const last = evs[evs.length - 1];
  if (!last) { $("feed").innerHTML = ""; return; }
  const earlier = evs.slice(-3, -1).reverse().map((e) =>
    `<div><span class="t">${e.time}</span>${describe(e)}</div>`).join("");
  // (A "[A3Z1 Crystal Grove] ..." zone prefix reads badly as speech.)
  const said = describe(last).replace(/^((?:<span[^>]*>[^<]*<\/span>)?(?:<em>[^<]*<\/em>)?)\[[^\]]*\]\s*/, "$1");
  $("feed").innerHTML = `<div class="say">${said}</div><div class="earlier">${earlier}</div>`;
  $("dbtn").textContent = (last.tag || last.kind || "thinking").toUpperCase();
}

function tick() {
  if (!data) return;
  $("live").textContent = clock(Date.now() / 1000 - (data.live_since || Date.now() / 1000));
  const up = ((data.status || {}).uptime_s || 0) + (Date.now() - fetchedAt) / 1000;
  $("uptime").textContent = data.running ? clock(up) : "—";
  gameText($("live")); gameText($("uptime"));
}

let lastFeed = "";
async function poll() {
  try {
    const [d, t, bp] = await Promise.all([
      fetch(`data.json?t=${Date.now()}`, { cache: "no-store" }).then((r) => r.json()),
      fetch(`thoughts.json?t=${Date.now()}`, { cache: "no-store" }).then((r) => r.json()),
      fetch(`battle.json?t=${Date.now()}`, { cache: "no-store" }).then((r) => r.json()).catch(() => null),
    ]);
    data = d; thoughts = t; battle = bp; fetchedAt = Date.now();
    setTimeout(() => gameText(document.body), 0);  // (after this poll's rendering)
    renderSide();
    renderLower();
    const fighting = !!(bp && bp.active && (bp.deck || []).length && (d.status || {}).in_battle);
    stripMode(fighting);
    renderBestDraw(bp, !!(d.status || {}).in_battle);
    if (fighting) {
      renderTracker();
    } else {
      const key = JSON.stringify(t.events.slice(-4).map((e) => e.time + e.text));
      if (key !== lastFeed) { lastFeed = key; renderFeed(); }  // re-render only on news: keeps the slide-in
    }
  } catch (e) {
    $("state").textContent = "OFFLINE";
  }
}
poll();
setInterval(poll, 2000);
setInterval(tick, 1000);
</script>
</body>
</html>
